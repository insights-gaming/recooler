name: Publish package
on:
  push:
    branches:
      - main

# the id-token permission that npm's OIDC publish needs is granted to the release job only, so that
# the called CI jobs (dependency installs, lifecycle scripts) don't get it
permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # builds the package and runs the tests, the conformance suite and the playground checks;
  # nothing is published unless all of it passes
  call-ci:
    uses: ./.github/workflows/ci.yaml

  release:
    name: Release
    needs: [call-ci]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install Dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 10
          command: pnpm i --frozen-lockfile

      # prepack builds dist
      - name: Publish to npm
        run: npm publish

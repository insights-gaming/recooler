name: Test
on:
  pull_request:
    branches:
      - main
  # release.yml runs this workflow on every push to main and only publishes if every job passes,
  # so there is no separate push trigger here
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # the client regression tests drive a headless Chromium
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # the conformance suite, the playground and the Vite integration tests load the built dist
      - name: Build
        run: pnpm run build

      - name: Type check
        run: pnpm run typecheck

      - name: Unit and integration tests
        run: pnpm run test

      - name: Conformance
        run: pnpm run test:conformance

      - name: Playground
        run: |
          pnpm --filter playground build
          pnpm --filter playground check
          pnpm --filter playground typecheck
